<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icons/profile.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="Sarath A is a MERN stack developer from Thrissur, Kerala, building scalable and user-friendly web applications with React, Node.js, Express and MongoDB."
    />
    <meta name="author" content="Sarath A" />
    <meta property="og:title" content="Sarath A | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer specializing in React, Node.js, Express and MongoDB."
    />
    <meta property="og:type" content="website" />
    <title>Sarath A | MERN Stack Developer</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark =
          storedTheme === "dark" || (!storedTheme && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", isDark ? "#0a0a0f" : "#f8fafc");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
